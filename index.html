<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURA EDU | 학생의 잠재력을 현실로 만드는 연구 파트너</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07150d;
            --bg-darker: #040c07;
            --bg-card: #0f2619;
            --neon-green: #00ff66;
            --neon-green-hover: #00cc52;
            --kakao-yellow: #FEE500;
            --kakao-brown: #191919;
            --text-main: #ffffff;
            --text-sub: #a3c1ad;
            --border-color: rgba(0, 255, 102, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }

        /* 상단 네비게이션 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(7, 21, 13, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .logo span { color: var(--neon-green); }
        .nav-links { display: flex; gap: 28px; align-items: center; font-size: 14px; font-weight: 600; }
        .nav-links a:hover { color: var(--neon-green); }
        .header-time { font-size: 13px; color: var(--text-sub); }
        .header-time strong { color: var(--neon-green); }

        /* 히어로 섹션 (좌측 메인 비전 + 우측 1:1 무료 상담 폼) */
        .hero {
            padding: 75px 8% 85px 8%;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 50px;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.12);
            color: var(--neon-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 22px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.8px;
        }

        .hero h1 { font-size: 40px; font-weight: 800; line-height: 1.3; margin-bottom: 18px; letter-spacing: -0.5px; }
        .hero h1 span { color: var(--neon-green); display: block; margin-top: 4px; }
        .hero p { font-size: 16.5px; color: var(--text-sub); margin-bottom: 34px; line-height: 1.75; }

        .cta-buttons { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 30px; }

        .btn {
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-kakao {
            background-color: var(--kakao-yellow);
            color: var(--kakao-brown);
        }
        .btn-kakao:hover {
            background-color: #f5dc00;
            transform: translateY(-2px);
        }

        .btn-primary { background-color: var(--neon-green); color: #05110a; }
        .btn-primary:hover { background-color: var(--neon-green-hover); transform: translateY(-2px); }

        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--neon-green); color: var(--neon-green); }
