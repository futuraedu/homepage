<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURA EDU | 학생의 잠재력을 현실로 만드는 연구 파트너</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07150d;
            --bg-darker: #040c07;
            --bg-card: #0f2619;
            --neon-green: #00ff66;
            --neon-green-hover: #00cc52;
            --kakao-yellow: #FEE500;
            --kakao-brown: #191919;
            --naver-green: #03C75A;
            --text-main: #ffffff;
            --text-sub: #a3c1ad;
            --border-color: rgba(0, 255, 102, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }

        /* 상단 네비게이션 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(7, 21, 13, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .logo span { color: var(--neon-green); }
        .nav-links { display: flex; gap: 24px; align-items: center; font-size: 14px; font-weight: 600; }
        .nav-links a:hover { color: var(--neon-green); }
        .header-time { font-size: 13px; color: var(--text-sub); }
        .header-time strong { color: var(--neon-green); }

        /* 히어로 섹션 */
        .hero {
            padding: 75px 8% 85px 8%;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 50px;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.12);
            color: var(--neon-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 22px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.8px;
        }

        .hero h1 { font-size: 40px; font-weight: 800; line-height: 1.3; margin-bottom: 18px; letter-spacing: -0.5px; }
        .hero h1 span { color: var(--neon-green); display: block; margin-top: 4px; }
        .hero p { font-size: 16.5px; color: var(--text-sub); margin-bottom: 34px; line-height: 1.75; }

        .cta-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }

        .btn {
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14.5px;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-kakao {
            background-color: var(--kakao-yellow);
            color: var(--kakao-brown);
        }
        .btn-kakao:hover { background-color: #f5dc00; transform: translateY(-2px); }

        .btn-naver {
            background-color: var(--naver-green);
            color: #ffffff;
        }
        .btn-naver:hover { background-color: #02b351; transform: translateY(-2px); }

        .btn-primary { background-color: var(--neon-green); color: #05110a; }
        .btn-primary:hover { background-color: var(--neon-green-hover); transform: translateY(-2px); }

        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--neon-green); color: var(--neon-green); }

        .quick-channel-box {
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.8;
        }
        .quick-channel-box a { color: var(--text-main); font-weight: 600; }
        .quick-channel-box a:hover { color: var(--neon-green); text-decoration: underline; }

        /* 크림슨 스타일 1:1 무료 상담 신청 카드 */
        .consult-form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
        }

        .consult-form-card h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .consult-form-card h3 span { color: var(--neon-green); }
        .consult-form-card .sub-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .role-selector input[type="radio"] { display: none; }
        .role-selector label {
            text-align: center;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(7, 21, 13, 0.6);
            color: var(--text-sub);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .role-selector input[type="radio"]:checked + label {
            background: var(--neon-green);
            color: #05110a;
            border-color: var(--neon-green);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(7, 21, 13, 0.85);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input::placeholder { color: rgba(163, 193, 173, 0.6); }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--neon-green);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--neon-green);
            color: #05110a;
            font-size: 16px;
            font-weight: 800;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-submit:hover {
            background: var(--neon-green-hover);
            transform: translateY(-2px);
        }

        /* 연구 파트너십 소개 배너 */
        .partner-banner-section {
            padding: 60px 8%;
            background: linear-gradient(180deg, #07150d 0%, #0b2014 100%);
            border-top: 1px solid rgba(0, 255, 102, 0.15);
        }

        .partner-banner {
            background: var(--bg-card);
            border: 1px solid var(--neon-green);
            border-radius: 16px;
            padding: 40px 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            box-shadow: 0 16px 40px rgba(0, 255, 102, 0.06);
        }

        .partner-banner-text .tag {
            color: var(--neon-green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        .partner-banner-text h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
        }
